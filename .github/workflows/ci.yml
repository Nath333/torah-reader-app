name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    runs-on: [self-hosted, windows-xps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Qualité des dictionnaires (pré-build)
        run: node scripts/verifyDictionaryQuality.js

      - name: Tests (vitest)
        run: npm test

      - name: Build de production
        run: npm run build
