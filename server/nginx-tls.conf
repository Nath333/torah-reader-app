# Frontal TLS de la stack limud — sert https://192.168.2.100:8443
# Certificat signé par le CA homelab (SAN DNS:limud.homelab.local + IP:192.168.2.100).
# Ne jamais committer limud.key.

server {
    listen 443 ssl;
    server_name limud.homelab.local;

    ssl_certificate     /etc/nginx/certs/limud.crt;
    ssl_certificate_key /etc/nginx/certs/limud.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://limud-proxy:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
